# Connection for dbt. Same role the Python loader uses; dbt-postgres wants the parts, not a URL.
# `nfl-pipeline transform`/`refresh` derive NFL_DB_* from NFL_DATABASE_URL when they are unset,
# so normally only the URL needs configuring (sslmode=require for Azure).
nfl:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('NFL_DB_HOST', 'localhost') }}"
      port: "{{ env_var('NFL_DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('NFL_DB_USER', 'nfl') }}"
      password: "{{ env_var('NFL_DB_PASSWORD', 'nfl') }}"
      dbname: "{{ env_var('NFL_DB_NAME', 'nfl') }}"
      sslmode: "{{ env_var('NFL_DB_SSLMODE', 'prefer') }}"
      schema: clean
      # 1 thread: models that reference the same parents (players, teams, games) take
      # ShareRowExclusive locks on them while creating foreign keys and deadlock when run in
      # parallel. The whole project builds in well under a minute anyway.
      threads: 1
