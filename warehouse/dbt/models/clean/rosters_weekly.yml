version: 2
models:
- name: rosters_weekly
  description: 'Typed copy of staging.rosters_weekly: every column, same names, types fixed. Upserted
    by primary key on every load.'
  config:
    unique_key: &id001
    - _row_id
  constraints:
  - type: primary_key
    columns: *id001
  columns:
  - name: _row_id
    data_type: text
    description: md5 of the identifying columns; surrogate primary key for tables whose source key is
      not unique or contains NULLs.
  - name: season
    data_type: smallint
    description: NFL season. Defaults to current year after March, otherwise is previous year.
  - name: team
    data_type: text
    description: NFL team. Uses official abbreviations as per NFL.com
  - name: position
    data_type: text
    description: Primary position as reported by NFL.com
  - name: depth_chart_position
    data_type: text
    description: Position assigned on depth chart. Not always accurate!
  - name: jersey_number
    data_type: text
    description: Jersey number. Often useful for joins by name/team/jersey.
  - name: status
    data_type: text
    description: 'Roster status: describes things like Active, Inactive, Injured Reserve, Practice Squad
      etc'
  - name: full_name
    data_type: text
    description: Full name as per NFL.com
  - name: first_name
    data_type: text
    description: First name as per NFL.com
  - name: last_name
    data_type: text
    description: Last name as per NFL.com
  - name: birth_date
    data_type: date
    description: Birthdate, as recorded by Sleeper API
  - name: height
    data_type: smallint
    description: Official height, in inches
  - name: weight
    data_type: smallint
    description: Official weight, in pounds
  - name: college
    data_type: text
    description: Official college (usually the last one attended)
  - name: gsis_id
    data_type: text
    description: 'Game Stats and Info Service ID: the primary ID for play-by-play data.'
  - name: espn_id
    data_type: text
    description: Player ID for ESPN API
  - name: sportradar_id
    data_type: text
    description: Player ID for Sportradar API
  - name: yahoo_id
    data_type: text
    description: Player ID for Yahoo API
  - name: rotowire_id
    data_type: text
    description: Player ID for Rotowire
  - name: pff_id
    data_type: text
    description: Player ID for Pro Football Focus
  - name: pfr_id
    data_type: text
    description: Player ID for Pro Football Reference
  - name: fantasy_data_id
    data_type: text
    description: Player ID for FantasyData
  - name: sleeper_id
    data_type: text
    description: Player ID for Sleeper API
  - name: years_exp
    data_type: smallint
    description: Years played in league
  - name: headshot_url
    data_type: text
    description: A URL string that points to player photos used by NFL.com (or sometimes ESPN)
  - name: ngs_position
    data_type: text
    description: Primary position as reported by the NextGen stats API.
  - name: week
    data_type: smallint
    description: The most recent week of that season that a player appeared on the roster.
  - name: game_type
    data_type: text
    description: The most recent game type of that season that a player appeared on the roster.
  - name: status_description_abbr
    data_type: text
    description: A code corresponding to a particular NFL status.
  - name: football_name
    data_type: text
    description: The nickname or first name typically used by a player.
  - name: esb_id
    data_type: text
    description: Player ID for Elias Sports Bureau
  - name: gsis_it_id
    data_type: text
    description: Player ID for the GSIS IT API
  - name: smart_id
    data_type: text
    description: Player ID hash for a player's ESB ID
  - name: entry_year
    data_type: smallint
    description: The year a player first became eligible to play in the NFL.
  - name: rookie_year
    data_type: smallint
    description: The year a player lost their rookie eligibility.
  - name: draft_club
    data_type: text
    description: The team that originally drafted a player. NA if a player went undrafted in their draft-eligible
      year.
  - name: draft_number
    data_type: text
    description: The number pick that was used to select a given player.
  - name: _loaded_at
    data_type: timestamp with time zone
    description: When this row was loaded into staging. Drives incremental upserts into clean.
