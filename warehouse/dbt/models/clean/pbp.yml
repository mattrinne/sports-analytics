  - name: qb_epa
    data_type: double precision
    description: Gives QB credit for EPA for up to the point where a receiver lost a fumble after a completed
      catch and makes EPA work more like passing yards on plays with fumbles.
  - name: xyac_epa
    data_type: double precision
    description: Expected value of EPA gained after the catch, starting from where the catch was made.
      Zero yards after the catch would be listed as zero EPA.
  - name: xyac_mean_yardage
    data_type: double precision
    description: Average expected yards after the catch based on where the ball was caught.
  - name: xyac_median_yardage
    data_type: smallint
    description: Median expected yards after the catch based on where the ball was caught.
  - name: xyac_success
    data_type: double precision
    description: Probability play earns positive EPA (relative to where play started) based on where ball
      was caught.
  - name: xyac_fd
    data_type: double precision
    description: Probability play earns a first down based on where the ball was caught.
  - name: xpass
    data_type: double precision
    description: Probability of dropback scaled from 0 to 1.
  - name: pass_oe
    data_type: double precision
    description: Dropback percent over expected on a given play scaled from 0 to 100.
  - name: _loaded_at
    data_type: timestamp with time zone
    description: When this row was loaded into staging. Drives incremental upserts into clean.
