version: 2
models:
  - name: referee_identities
    description: >-
      Master data for referees: every spelling seen in clean.schedules.referee (1999+), at the
      Referee position in clean.officials (2015+), or in reference_mappings (domain referee_name),
      resolved to a canonical name and a referee_id minted here (sequence reference.referee_id_seq,
      never reused). nflverse's official_id is not used as the key: it was renumbered in 2023 and is
      absent before 2015. nfl.referees is derived from this table. Join a referee name column
      through alias to get referee_id.
    constraints:
      - type: primary_key
        columns: [alias]
    columns:
      - name: alias
        data_type: text
        description: A spelling as it appears in some source.
      - name: referee_id
        data_type: integer
        description: Surrogate key, one per canonical name.
        constraints: [{type: not_null}]
      - name: referee_name
        data_type: text
        description: Canonical name the spelling resolves to.
        constraints: [{type: not_null}]
      - name: source
        data_type: text
        description: canonical (the spelling is the canonical name) or reference_mappings (mapped spelling).
        data_tests:
          - accepted_values:
              arguments:
                values: [canonical, reference_mappings]
      - name: created_at
        data_type: timestamp with time zone
        constraints: [{type: not_null}]
      - name: updated_at
        data_type: timestamp with time zone
        description: Last time the row's id, canonical name or source changed.
        constraints: [{type: not_null}]
