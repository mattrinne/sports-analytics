version: 2
models:
  - name: nfl_coaches
    description: >-
      Coach dimension (nfl.coaches), one row per coach_id with the canonical name, derived from
      reference.coach_identities where ids are minted and spellings resolved. Covers every coach in
      the Wikipedia staff data (2010+) and every head coach in the nflverse game log (1999+). Use coach_id for
      joins; resolve source names through reference.coach_identities.alias.
    constraints:
      - type: primary_key
        columns: [coach_id]
      - type: unique
        columns: [coach_name]
    columns:
      - name: coach_id
        data_type: integer
        description: Surrogate key (reference.coach_id_seq), one per canonical name, never reused.
      - name: coach_name
        data_type: text
        description: Canonical coach name.
        constraints: [{type: not_null}]
      - name: created_at
        data_type: timestamp with time zone
        description: First time any spelling of this coach was seen.
        constraints: [{type: not_null}]
      - name: updated_at
        data_type: timestamp with time zone
        description: Last time any of the coach's identity rows changed.
        constraints: [{type: not_null}]
