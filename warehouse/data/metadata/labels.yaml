# Controlled vocabulary for column labels. Each axis holds at most one label per column.
# Builds fail if rules.yaml or overrides.yaml use a label that is not listed here.
role:
  identifier: Keys and cross-source ids (game_id, play_id, gsis_id, espn_id).
  dimension: Categorical descriptor (team, position, play_type, roof, coverage type).
  time: When something happened (season, week, gameday, quarter, clock, timestamps).
  situation: Game state at the moment of the play (down, distance, field position, score differential, timeouts).
  flag: 0/1 or boolean indicator (pass_attempt, touchdown, shotgun, overtime).
  measure: Counting stat or yardage (passing_yards, receptions, def_sacks, kick_distance).
  derived: Ratio, share, or composite computed from measures (pacr, wopr, target_share, fg_pct, fantasy_points).
  model: Statistical model output (ep, epa, wp, wpa, cp, cpoe, xpass, xyac_*).
  betting: Market lines and odds (spread_line, total_line, moneylines, over/under odds).
  text: Free text (play description, weather string, made-kick lists).
  media: URLs, colors, logos, headshots.
  system: Pipeline or source-system bookkeeping (_loaded_at, nfl_api_id, play_deleted).

side:
  offense: Describes the team with the ball / the offensive player.
  defense: Describes the defending team / defensive player.
  special_teams: Kicking, punting, kickoffs, returns.
  neutral: Game context belonging to neither side (score, clock, weather, venue, home/away splits).

entity:
  player: About an individual player.
  team: About a team.
  game: About a game as a whole.
  play: About a single play.
  drive: About a drive or series.
  coach: About a head coach.
  official: About a game official.
  venue: About the stadium or playing conditions.

category:
  passing: Passing stats and attribution.
  rushing: Rushing stats and attribution.
  receiving: Receiving and target stats.
  scoring: Touchdowns, points, conversions, scoring results.
  turnovers: Fumbles and interceptions from the offense's perspective.
  first_downs: First-down and down-conversion outcomes.
  penalties: Penalties and penalty yardage.
  tackling: Tackles, assists, tackles for loss.
  pass_rush: Sacks, QB hits, pressures, pass rushers.
  coverage: Pass defense, defensive interceptions, coverage scheme.
  kicking: Field goals and extra points.
  punting: Punts.
  kickoffs: Kickoffs and onside recoveries.
  returns: Punt and kickoff returns.
  personnel: Formation, personnel groupings, players on the field.
  game_state: Score, clock, down and distance, field position, timeouts.
  drive: Drive-level attributes.
  series: Series-level attributes.
  expected_points: EP / EPA model and its splits.
  win_probability: WP / WPA model incl. Vegas-adjusted variants.
  passing_model: Completion probability, xpass, xYAC and related models.
  schedule: Dates, times, game type, rest days.
  betting: Closing lines and odds.
  weather: Temperature, wind, roof, surface, weather text.
  venue: Stadium identity.
  officiating: Referees and officials.
  coaching: Head coaches.
  roster: Roster status, depth chart slot, jersey number, experience.
  bio: Height, weight, birth date, college, draft.
  identity: Identifiers and names.
  branding: Team names, colors, logos.
  fantasy: Fantasy points and fantasy-specific fields.
  system: Pipeline bookkeeping.
