version: 2
models:
  - name: nfl_coach_aliases
    description: Every known spelling of a coach mapped to its coach_id (canonical names plus reference_mappings rows).
    columns:
      - name: alias
        description: A spelling as it appears in some source.
        data_tests:
          - unique
          - not_null
      - name: coach_id
        data_tests:
          - not_null
