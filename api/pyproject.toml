[project]
name = "nfl-api"
version = "0.1.0"
description = "Read-only HTTP API over the NFL warehouse marts (nfl.*) and run history (ops.*)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]  # Depends()/Query() in defaults is the idiomatic FastAPI style

[tool.pytest.ini_options]
testpaths = ["tests"]
