[project]
name = "nfl-pipeline"
version = "0.1.0"
description = "Load nflverse NFL data into a local Postgres warehouse, orchestrated by Airflow."
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pyarrow>=15",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.scripts]
nfl-pipeline = "nfl_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "apache-airflow==3.3.1",
    "dbt-core~=1.12",
    "dbt-postgres~=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]  # typer.Option() in defaults is the idiomatic typer style

[tool.pytest.ini_options]
testpaths = ["tests"]
