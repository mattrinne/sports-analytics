# Postgres, the read-only API (built from ./api, :8000) and the on-demand pipeline image (built
# from ./warehouse). Postgres and api are the long-running services.
#   cp .env.example .env
#   docker compose up -d                                  # postgres + api
#   docker compose build pipeline                         # the nfl-pipeline image, from ./warehouse
#   docker compose run --rm pipeline backfill --start 2010  # first load (hours), then dbt build
#   docker compose run --rm pipeline refresh              # current season + dbt build + truncate staging
#   docker compose run --rm pipeline transform --full-refresh --select teams
# Warehouse: postgresql://nfl:nfl@localhost:5432/nfl      API: http://localhost:8000/docs
# The api connects as the read-only role nfl_reader (docker/postgres/init/02-reader-role.sh). On a
# volume created before that script existed, apply it once:
#   docker compose exec -T postgres bash /docker-entrypoint-initdb.d/02-reader-role.sh
#
# Scheduling is not a service here. Deployed, an Azure Container Apps Job runs `refresh` on a cron
# (see deploy/azure); locally you run it by hand.
#
# Staging is truncated after every green dbt build; the rule and its exceptions are in
# warehouse/CLAUDE.md (Layers, dbt conventions).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d nfl"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build: ./api
    image: nfl-api:local
    ports:
      - "8000:8000"
    # No env_file: the api gets only these three (compose still reads .env for the ${...} values),
    # not the superuser password or the owner-role URL.
    environment:
      NFL_DATABASE_URL: postgresql://nfl_reader:nfl_reader@postgres:5432/nfl
      NFL_API_KEY: ${NFL_API_KEY:-}
      NFL_API_CORS_ORIGINS: ${NFL_API_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pipeline:
    build: ./warehouse
    image: nfl-pipeline:local
    profiles: [tools]  # not started by `up`; `docker compose run --rm pipeline <command>`
    env_file:
      - path: .env
        required: false
    environment:
      NFL_DATABASE_URL: postgresql://nfl:nfl@postgres:5432/nfl
      NFL_START_SEASON: ${NFL_START_SEASON:-2010}
      NFL_ALERT_WEBHOOK_URL: ${NFL_ALERT_WEBHOOK_URL:-}
      # nflverse parquet files are cached on a named volume (nflreadpy's default duration is a day)
      # so re-runs skip the download. /cache is owned by the image's `nfl` user.
      NFLREADPY_CACHE: filesystem
      NFLREADPY_CACHE_DIR: /cache/nflreadpy
    volumes:
      - pipeline-cache:/cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pipeline-cache:
